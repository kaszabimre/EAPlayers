name: Weekly Kaggle CSV Update

on:
  schedule:
    - cron: '0 0 * * 0' # every sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install Kaggle API
        run: pip install kaggle

      - name: Configure Kaggle credentials
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${{ secrets.KAGGLE_USERNAME }}\",\"key\":\"${{ secrets.KAGGLE_KEY }}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download all_players.csv
        run: |
          kaggle datasets download -d nyagami/ea-sports-fc-25-database-ratings-and-stats -f all_players.csv --force

      - name: Unzip CSV (if needed)
        run: |
          if [ -f ea-sports-fc-25-database-ratings-and-stats.zip ]; then
            unzip -o ea-sports-fc-25-database-ratings-and-stats.zip
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add all_players.csv
          git diff --cached --quiet || git commit -m "Update all_players.csv [automated]"
          git push
